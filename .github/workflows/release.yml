name: Release

# يبني نسخة الإصدار عند وسم جديد (v1.0.0 مثلًا) وينشرها في Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (release bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev libglu1-mesa
      - name: Build the release bundle
        run: flutter build linux --release
      - name: Pack the bundle
        run: |
          cd build/linux/x64/release/bundle
          tar czf ../../../../../secondbrain-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: secondbrain-linux-x64
          path: secondbrain/build/linux/x64/release/bundle/secondbrain-linux-x64.tar.gz

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - run: flutter pub get
      - name: Build the APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: secondbrain-apk
          path: secondbrain/build/app/outputs/flutter-apk/app-release.apk

  publish:
    name: Publish to GitHub Releases
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/secondbrain-linux-x64/secondbrain-linux-x64.tar.gz
            artifacts/secondbrain-apk/app-release.apk
          generate_release_notes: true
