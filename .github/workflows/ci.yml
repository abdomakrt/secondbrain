name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Full suite including the S4 20k perf spike (~3 min extra).
      - run: flutter test
      # Linux desktop build proves the toolchain (Phase 0 gate).
      - run: sudo apt-get update -qq
      - run: >-
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config
          libgtk-3-dev libx11-dev libxi-dev
      - run: flutter build linux --debug
